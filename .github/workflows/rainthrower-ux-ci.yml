name: Rainthrower S10 source guards

on:
  push:
    branches: [release/v35-beta, 'fix/**']
  pull_request:
    branches: [release/v35-beta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-guards:
    name: Source-only regression checks (no firmware flashing)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and compile checks
        run: |
          python3 -m compileall -q scripts
          bash -n scripts/generate_ota_manifest.sh
          sh -n scripts/oneui9_installer/update-binary
          sh -n target/beyond1lte/patches/user_defaults/system/system/etc/s10-user-defaults.sh
          sh -n target/beyond1lte/patches/user_defaults/system/system/etc/init/s10-user-defaults.rc
      - name: UX and installer guard regressions
        run: |
          python3 scripts/tests/test_rainthrower_ux_guards.py
          python3 scripts/tests/test_s10_user_defaults.py
          python3 scripts/tests/test_oneui9_installer_preflight.py
      - name: Device-script fixture regressions
        run: |
          python3 scripts/tests/test_s10_display_defaults.py
          python3 scripts/tests/test_s10_boot_performance.py
          python3 scripts/tests/test_s10_qs_sync_permission.py
          python3 scripts/tests/test_s10_qs_mobile_data.py
          python3 scripts/tests/test_s10_twrp_bootstrap.py
      - name: Document validation limits
        run: |
          echo 'Static source checks only. No S10 boot, GMS, call, CE unlock, NFC, camera, Wi-Fi Direct or SystemUI runtime acceptance performed.'

  source-review-prerelease:
    name: Publish source-only review prerelease (never a flashable ROM)
    needs: source-guards
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/v35-beta'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish source review after source guards pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=source-ux-fixes-2026-11-10
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Source review release already exists.'
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
            --title 'Rainthrower UX source fixes — hardware unverified' \
            --notes 'SOURCE ONLY — NOT A FLASHABLE ROM. Fixes source defects in thermal configuration, app preservation, user defaults, OTA metadata, and workflow safety. No hardware boot, encryption, calls, camera, SystemUI, or Wi-Fi Direct compatibility is certified. Do not flash this source archive as firmware.'
